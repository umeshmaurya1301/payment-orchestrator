spring:
  # Phase 7i. The drain budget for `server.shutdown: graceful` below.
  #
  # Derived, not chosen: it has to exceed the longest a request may still be
  # running (the deadline budget), and docker-compose.yml's stop_grace_period
  # has to exceed IT, or Docker SIGKILLs a server that is draining correctly.
  # See payments-edge's application.yml for the chain and for what was broken
  # before this - Docker's default grace period is 10s, so the 30s drain was
  # being cut off two thirds of the way through.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_DRAIN:35s}
  application:
    name: psp-router
  threads:
    virtual:
      # Enabled from day one, deliberately. It changes how pool sizing behaves,
      # and phase 7 depends on having felt that from the start: virtual threads
      # do not fix a bounded resource, they move where the queue forms.
      enabled: true
  mvc:
    problemdetails:
      # Lets Spring render its own MVC exceptions as RFC-7807, alongside the
      # ProblemDetailHandler that web-starter contributes.
      enabled: true

server:
  port: 8082
  # The in-flight drain this enables is demonstrated and tested in phase 7.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true