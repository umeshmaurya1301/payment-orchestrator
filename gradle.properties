org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Configuration cache is left OFF for now. Turn it on once the build stops
# changing shape every phase - the failures it produces are noisy and the
# payoff on a build this size is small.
org.gradle.configuration-cache=false
