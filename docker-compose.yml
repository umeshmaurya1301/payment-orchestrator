# Profiles
# --------
#   (default)  core  - mysql, redis, and the five services needed for a payment
#                      to flow end to end. Started by plain `docker compose up`,
#                      which is why these carry no `profiles:` key.
#   async            - kafka x3 (KRaft), mongo, ledger-notifier.  Phase 6.
#   obs              - see the note at the bottom of this file.               Phase 4.
#
# Usage:
#   ./gradlew bootJar && docker compose up -d --build
#   docker compose --profile async up -d
#
name: payorch

# The vault's AES-256 key, shared by the only two services allowed to reach the
# vault. They MUST agree: the token is used as GCM additional authenticated
# data, so a mismatched key fails the tag check and every detokenization throws.
# A local development value in a committed file, deliberately - phase 9c is where
# secrets stop being literals and the static key becomes envelope encryption.
x-vault-key: &vault-key "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

x-java-service: &java-service
  restart: unless-stopped
  # A limit, so -XX:MaxRAMPercentage=70 in the Dockerfile has something to
  # compute a heap from. 640m x 70% is roughly a 448m heap, which is the ~450m
  # per service the resource budget assumes.
  mem_limit: 640m
  networks: [payorch]
  environment: &java-env
    JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    LOG_LEVEL: INFO

services:

  # ---------------------------------------------------------------- core ----

  mysql:
    image: mysql:8.4
    container_name: payorch-mysql
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payorch
      MYSQL_USER: payorch
      MYSQL_PASSWORD: payorch
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the isolated payorch_vault database and its vault_writer /
      # vault_reader credentials. MySQL runs this ONCE, on the first start
      # against an empty data directory - a volume that predates the file will
      # not have the vault, and payments-edge refuses to start with a message
      # saying so. `docker compose down -v` is the fix.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [payorch]

  redis:
    image: redis:7.4-alpine
    container_name: payorch-redis
    mem_limit: 256m
    # noeviction, deliberately, and not the usual allkeys-lru.
    #
    # From phase 3 Redis holds rate-limiter buckets, and from phase 7 it holds
    # idempotency in-flight markers. Under an LRU policy a memory spike silently
    # evicts those markers, and duplicate suppression quietly degrades into a
    # coin flip at exactly the moment load is highest. Failing writes loudly is
    # the correct behaviour for a correctness control.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [payorch]

  # Sits between the services and their datastores so the LINK can be broken
  # independently of the process and of the bean. Phase 0 made this a
  # compose-only change: every datastore URL is driven by an environment
  # variable, so repointing at a proxy port needs no code change and no rebuild.
  #
  # It is always in the path, even with no toxics applied. Running it only during
  # experiments would mean the baseline and the chaos run had different network
  # topologies, and the extra hop - about 0.2 ms locally - would be silently
  # folded into whatever the toxic did. An always-present proxy is a constant
  # that cancels out; an occasionally-present one is a confound.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: payorch-toxiproxy
    mem_limit: 128m
    ports:
      - "8474:8474"   # control API
      - "23306:23306" # -> mysql:3306
      - "26379:26379" # -> redis:6379
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes:
      - ./docker/toxiproxy:/config:ro
    healthcheck:
      # The image's own CLI, because the image is distroless: no shell, no wget,
      # no curl. A `wget` healthcheck here does not fail loudly - the container
      # runs perfectly and simply never reports healthy, and everything that
      # depends_on it refuses to start with a message about toxiproxy being
      # unhealthy rather than about the healthcheck being wrong.
      #
      # `list` also proves more than /version would: it returns the configured
      # proxies, so a healthy container is one whose proxies are actually loaded.
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [payorch]

  payment-orchestrator:
    <<: *java-service
    container_name: payorch-payment-orchestrator
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: payment-orchestrator
    environment:
      # Phase 6. Defaults to `none` so `docker compose up` without the async
      # profile still starts a service with no broker to talk to.
      EVENTS_PUBLISHER: ${EVENTS_PUBLISHER:-none}
      <<: *java-env
      # Points at the MySQL service name. Phase 2 repoints this at Toxiproxy's
      # listener instead, which is a compose change and no code change.
      # Through Toxiproxy, not straight at MySQL. Always, not only during an
      # experiment - see the comment on the toxiproxy service.
      ORCHESTRATOR_DB_URL: jdbc:mysql://toxiproxy:23306/payorch
      ORCHESTRATOR_DB_USER: payorch
      ORCHESTRATOR_DB_PASSWORD: payorch
      CONNECTOR_BASE_URL: http://psp-connector:8083
      # Overridable so an experiment can run the same build with and without an
      # effective bound - set it to an hour and the deadline is the "before".
      # One variable between the two runs is the whole point.
      DEADLINE_BUDGET_MS: ${DEADLINE_BUDGET_MS:-30000}
      DEADLINE_MAX_BUDGET_MS: ${DEADLINE_MAX_BUDGET_MS:-60000}
      DEADLINE_MIN_SLICE_MS: ${DEADLINE_MIN_SLICE_MS:-50}
    ports: ["8081:8081"]
    depends_on:
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  payments-edge:
    <<: *java-service
    container_name: payorch-payments-edge
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: payments-edge
    environment:
      <<: *java-env
      EDGE_DB_URL: jdbc:mysql://toxiproxy:23306/payorch
      EDGE_DB_USER: payorch
      EDGE_DB_PASSWORD: payorch
      ORCHESTRATOR_BASE_URL: http://payment-orchestrator:8081
      # Overridable so an experiment can run the same build with and without an
      # effective bound - set it to an hour and the deadline is the "before".
      # One variable between the two runs is the whole point.
      DEADLINE_BUDGET_MS: ${DEADLINE_BUDGET_MS:-30000}
      DEADLINE_MAX_BUDGET_MS: ${DEADLINE_MAX_BUDGET_MS:-60000}
      DEADLINE_MIN_SLICE_MS: ${DEADLINE_MIN_SLICE_MS:-50}
      # The vault, on its own credentials. vault_writer holds SELECT and INSERT
      # on payorch_vault.token_vault and nothing else; the payorch user above
      # has no grant on that schema at all.
      # The vault goes through the proxy too. It is the same MySQL instance, so
      # a latency toxic that did not affect tokenization would be modelling a
      # database that does not exist.
      VAULT_DB_URL: jdbc:mysql://toxiproxy:23306/payorch_vault
      VAULT_DB_USER: vault_writer
      VAULT_DB_PASSWORD: vault_writer_pw
      VAULT_KEY: *vault-key
      # 3e. The rate limiters' shared store. Redis rather than an in-process
      # counter because a per-instance limit is not a per-merchant limit: it
      # multiplies by the replica count and changes every time we scale.
      SPRING_DATA_REDIS_HOST: redis
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      RATELIMIT_KIND: ${RATELIMIT_KIND:-atomic-lua}
      RATELIMIT_MERCHANT_BURST: ${RATELIMIT_MERCHANT_BURST:-100}
      RATELIMIT_MERCHANT_RPS: ${RATELIMIT_MERCHANT_RPS:-50}
      RATELIMIT_WRITE_BURST: ${RATELIMIT_WRITE_BURST:-300}
      RATELIMIT_WRITE_RPS: ${RATELIMIT_WRITE_RPS:-150}
      RATELIMIT_READ_RPS: ${RATELIMIT_READ_RPS:-500}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      # Not just mysql. payment-orchestrator owns the Flyway migrations, and this
      # service starts with `ddl-auto: validate` - so it has to come up after the
      # tables it validates against exist, or it fails startup on a cold volume.
      payment-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  psp-router:
    <<: *java-service
    container_name: payorch-psp-router
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: psp-router
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  psp-connector:
    <<: *java-service
    container_name: payorch-psp-connector
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: psp-connector
    environment:
      <<: *java-env
      # Read-only vault credentials. This service can reverse a token and can do
      # nothing else to the vault - no INSERT, no UPDATE, no DELETE - and that is
      # enforced by the grants in docker/mysql/init/01-vault.sql rather than by
      # any code here. It has no application database at all.
      VAULT_DB_URL: jdbc:mysql://toxiproxy:23306/payorch_vault
      VAULT_DB_USER: vault_reader
      VAULT_DB_PASSWORD: vault_reader_pw
      VAULT_KEY: *vault-key
      # 3f. base_url is a psp_config column now, so the connector is told
      # how to reach the CONFIG rather than how to reach a provider - the
      # one piece of configuration that cannot itself come from the table.
      #
      # Straight to mysql, not through toxiproxy. A latency toxic aimed at
      # the payment path would otherwise also throttle config reloads, and
      # an experiment measuring a provider would silently be measuring the
      # config loop too.
      CONFIG_DB_URL: jdbc:mysql://mysql:3306/payorch
      CONFIG_DB_USER: config_reader
      CONFIG_DB_PASSWORD: config_reader_pw
      PSP_CONFIG_POLL_MS: ${PSP_CONFIG_POLL_MS:-2000}
      # 3b. Overridable so an experiment can run with retries off
      # (RETRY_MAX=0) as the 'before' arm, one variable at a time.
      RETRY_MAX: ${RETRY_MAX:-2}
      RETRY_BUDGET_RATIO: ${RETRY_BUDGET_RATIO:-0.1}
      BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-50}
      BREAKER_WINDOW_S: ${BREAKER_WINDOW_S:-30}
      BREAKER_MIN_CALLS: ${BREAKER_MIN_CALLS:-20}
      BREAKER_OPEN_S: ${BREAKER_OPEN_S:-10}
      BULKHEAD_KIND: ${BULKHEAD_KIND:-semaphore}
      BULKHEAD_LIMIT: ${BULKHEAD_LIMIT:-20}
      BULKHEAD_WAIT_MS: ${BULKHEAD_WAIT_MS:-250}
      BULKHEAD_QUEUE: ${BULKHEAD_QUEUE:-50}
      # Overridable so an experiment can run the same build with and without an
      # effective bound - set it to an hour and the deadline is the "before".
      # One variable between the two runs is the whole point.
      DEADLINE_BUDGET_MS: ${DEADLINE_BUDGET_MS:-30000}
      DEADLINE_MAX_BUDGET_MS: ${DEADLINE_MAX_BUDGET_MS:-60000}
      DEADLINE_MIN_SLICE_MS: ${DEADLINE_MIN_SLICE_MS:-50}
      # 3e's egress layer, on the same Redis. A provider's contracted TPS is a
      # global number; enforcing it per instance would multiply the limit by the
      # replica count and breach the contract exactly when we scaled out.
      SPRING_DATA_REDIS_HOST: redis
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      RATELIMIT_KIND: ${RATELIMIT_KIND:-atomic-lua}
      RATELIMIT_EGRESS_RPS: ${RATELIMIT_EGRESS_RPS:-200}
    ports: ["8083:8083"]
    depends_on:
      toxiproxy:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  mock-psp-simulator: &mock-psp
    <<: *java-service
    container_name: payorch-mock-psp-simulator
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: mock-psp-simulator
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------- three providers ----
  # Phase 3f. The same image three times, each with a different PERSONALITY:
  # the behaviour it exhibits when no chaos is being injected at all.
  #
  #   A  99.9% / 200 ms / 500 TPS   the good one
  #   B  96%   / 2.5 s  /  50 TPS   slow, flaky, rationed
  #   C  98%   / 800 ms / 200 TPS   unremarkable, which is its own case
  #
  # Three instances rather than three code paths in one, because a provider is
  # a network endpoint: separate containers give separate connection pools,
  # separate queues and separate failure domains, and a bulkhead that isolates
  # providers cannot be demonstrated against one process pretending to be three.
  #
  # The baseline is NOT chaos - /_chaos DELETE returns to these values, not to
  # zero. A reset that healed B would silently turn it into A for the next arm.
  #
  # `mock-psp-simulator` above keeps its unconfigured, perfectly healthy
  # baseline so every experiment from 00 to 05 reproduces exactly as written.

  mock-psp-a:
    <<: *mock-psp
    container_name: payorch-mock-psp-a
    environment:
      <<: *java-env
      PAYORCH_MOCKPSP_BASELINE_LATENCY_MS: ${PSP_A_LATENCY_MS:-200}
      PAYORCH_MOCKPSP_BASELINE_ERROR_RATE: ${PSP_A_ERROR_RATE:-0.001}
    ports: ["8086:8085"]

  mock-psp-b:
    <<: *mock-psp
    container_name: payorch-mock-psp-b
    environment:
      <<: *java-env
      PAYORCH_MOCKPSP_BASELINE_LATENCY_MS: ${PSP_B_LATENCY_MS:-2500}
      PAYORCH_MOCKPSP_BASELINE_ERROR_RATE: ${PSP_B_ERROR_RATE:-0.04}
    ports: ["8087:8085"]

  mock-psp-c:
    <<: *mock-psp
    container_name: payorch-mock-psp-c
    environment:
      <<: *java-env
      PAYORCH_MOCKPSP_BASELINE_LATENCY_MS: ${PSP_C_LATENCY_MS:-800}
      PAYORCH_MOCKPSP_BASELINE_ERROR_RATE: ${PSP_C_ERROR_RATE:-0.02}
    ports: ["8088:8085"]

  # --------------------------------------------------------------- async ----
  # Defined now so the profile exists, exercised from phase 6. Only the `core`
  # profile is covered by the phase-0 exit criteria.

  kafka-1: &kafka
    image: apache/kafka:4.1.0
    container_name: payorch-kafka-1
    profiles: ["async"]
    mem_limit: 768m
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # These three default to 1, which silently undoes the durability the rest
      # of the phase-6 design depends on: internal topics would live on a single
      # broker, so killing that broker loses consumer offsets and transaction
      # state even though the data topics are replicated three ways.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: payorch-local-cluster-01
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [payorch]

  kafka-2:
    <<: *kafka
    container_name: payorch-kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: payorch-kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # Phase 6c. The CDC arm of the outbox comparison.
  #
  # A separate container, and that IS the point being measured. The polling relay
  # is fifty lines inside a service that already exists; this is a second
  # distributed system with its own memory, its own failure modes and its own
  # upgrade cycle. The phase-6 plan asks for both so the trade is a measurement
  # rather than an opinion.
  #
  # Kafka Connect stores its own state in Kafka - offsets, configs and statuses -
  # in the three topics named below. They are created with replication factor 3
  # for the same reason the payment topics are: a connector whose offsets live on
  # one broker replays or loses its position when that broker dies, which would
  # make the whole exercise pointless on the exact test phase 6 exists to pass.
  debezium-connect:
    image: quay.io/debezium/connect:3.0.0.Final
    container_name: payorch-debezium
    profiles: ["async"]
    mem_limit: 1g
    depends_on:
      kafka-1:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: payorch-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      # The connector produces JSON without a schema envelope. With schemas on,
      # every message carries a full Connect schema description that is larger
      # than the payload it wraps, and nothing downstream reads it.
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      # 8090 on the host. Kafka Connect's REST API defaults to 8083, which
      # psp-connector already owns; 8084 was the obvious second choice and
      # ledger-notifier owns that. The services occupy 8080-8088 contiguously, so
      # the tool moves above the block rather than into a gap that the next
      # service will want. Same rule as SigNoz's UI in phase 4: move the tool,
      # not the payment path.
      - "8090:8083"
    networks: [payorch]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mongo:
    image: mongo:8.0
    container_name: payorch-mongo
    profiles: ["async"]
    mem_limit: 1g
    # A replica set of one. Standalone mongod cannot do transactions, and the
    # phase-6 ledger write path needs them - so even a single node has to be
    # initiated as a replica set.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [payorch]

  mongo-init:
    image: mongo:8.0
    container_name: payorch-mongo-init
    profiles: ["async"]
    depends_on:
      mongo:
        condition: service_healthy
    # Idempotent: rs.initiate() throws once the set is already initiated, so the
    # status check keeps a re-run from failing the whole compose up.
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo --quiet --eval
        'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'
    restart: on-failure
    networks: [payorch]

  ledger-notifier:
    <<: *java-service
    container_name: payorch-ledger-notifier
    profiles: ["async"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: ledger-notifier
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # ----------------------------------------------------------------- obs ----
  #
  # Intentionally empty in phase 0.
  #
  # SigNoz is not defined here because phase 4 attaches it on an EXTERNAL docker
  # network rather than merging its compose file into this one. SigNoz ships its
  # own multi-container stack (ClickHouse, collector, query service, frontend);
  # vendoring a copy of it here would mean re-reconciling it by hand on every
  # SigNoz upgrade. Phase 4 adds:
  #
  #     networks:
  #       signoz-net:
  #         external: true
  #
  # and attaches each service to it, so the two stacks stay independently
  # upgradeable. ClickHouse is also the single largest memory consumer in the
  # budget (3-4 GB), which is exactly why it sits behind a profile and is not
  # started during phases 1-3.

networks:
  payorch:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  mongo-data:
