spring:
  application:
    name: psp-connector
  threads:
    virtual:
      # Enabled from day one, deliberately. It changes how pool sizing behaves,
      # and phase 7 depends on having felt that from the start: virtual threads
      # do not fix a bounded resource, they move where the queue forms.
      enabled: true
  mvc:
    problemdetails:
      # Lets Spring render its own MVC exceptions as RFC-7807, alongside the
      # ProblemDetailHandler that web-starter contributes.
      enabled: true

server:
  port: 8083
  # The in-flight drain this enables is demonstrated and tested in phase 7.
  shutdown: graceful

payorch:
  vault:
    # Read-only credentials. This service can reverse a token and can do nothing
    # else to the vault - no INSERT, no UPDATE, no DELETE - and that is enforced
    # by the grants in docker/mysql/init/01-vault.sql, not by this file.
    datasource:
      url: ${VAULT_DB_URL:jdbc:mysql://localhost:3306/payorch_vault}
      username: ${VAULT_DB_USER:vault_reader}
      password: ${VAULT_DB_PASSWORD:vault_reader_pw}
      pool-size: ${VAULT_DB_POOL_SIZE:5}
    # Local development key. Phase 9c replaces the whole static-key arrangement
    # with envelope encryption; until then this must match payments-edge's key,
    # or every detokenization fails the GCM tag check.
    key: ${VAULT_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

  psp:
    providers:
      mockpsp:
        base-url: ${MOCK_PSP_BASE_URL:http://localhost:8085}

  resilience:
    deadline:
      # Internal hop: it MUST trust the inbound header, because the remaining
      # budget arriving from upstream is the entire mechanism. A hop that
      # ignored it would restart the clock and the budget would never shrink.
      #
      # Still clamped to max-budget-ms. "Internal" describes today's network
      # topology, not a guarantee about who can reach this port.
      budget-ms: ${DEADLINE_BUDGET_MS:30000}
      # A hard ceiling on any budget, including a trusted inbound one. Also
      # overridable, because it clamps the internal hops and would otherwise
      # silently cap an experiment that only raised budget-ms.
      max-budget-ms: ${DEADLINE_MAX_BUDGET_MS:60000}
      # Below this, a hop declines rather than starting a call it cannot
      # finish. Overridable so the decline path can be demonstrated on a
      # live stack rather than only in a unit test.
      min-slice-ms: ${DEADLINE_MIN_SLICE_MS:50}
      trust-inbound-header: true

    retry:
      # 3b. Classification first, then the mechanism.
      #
      # budget-ratio caps retries at 10% of TOTAL traffic - not of failures.
      # A ratio of failures would rise as the failure rate rose, which is
      # exactly backwards: the worse things get, the less a struggling provider
      # can absorb being asked again.
      max-retries: ${RETRY_MAX:2}
      base-delay-ms: 50
      max-delay-ms: 1000
      budget-ratio: ${RETRY_BUDGET_RATIO:0.1}
      budget-max-tokens: 100

    breaker:
      # 3c. Thresholds from the baseline, not from feel.
      #
      # 50% because a healthy provider here runs at essentially zero: the phase-2
      # control saw 100% success and the 30-minute soak saw one failure in
      # 36,001. Half the calls failing is unambiguous. 3b's retry already absorbs
      # transient blips, so this should only fire on sustained failure - and a
      # threshold near the injected 40% error rate would flap continuously,
      # which is the trap the phase-3 notes call out.
      failure-rate-threshold: ${BREAKER_THRESHOLD:50}
      window-seconds: ${BREAKER_WINDOW_S:30}
      minimum-calls: ${BREAKER_MIN_CALLS:20}
      wait-in-open-seconds: ${BREAKER_OPEN_S:10}
      half-open-permits: 5

    bulkhead:
      # 3d. Admission control - the phase-2 baseline's highest-priority fix.
      #
      # Semaphore by default: under virtual threads a waiting caller parks a
      # virtual thread costing a few hundred bytes, where a thread-pool bulkhead
      # would pay a platform thread to isolate something already cheap. 3d
      # measures both rather than asserting it.
      #
      # max-concurrent-calls is sized from the provider's contracted TPS by
      # Little's law: concurrency = TPS x latency.
      kind: ${BULKHEAD_KIND:semaphore}
      max-concurrent-calls: ${BULKHEAD_LIMIT:20}
      max-wait-ms: ${BULKHEAD_WAIT_MS:250}
      queue-capacity: ${BULKHEAD_QUEUE:50}
      # BREAKER_THRESHOLD=100 makes the breaker unreachable, which is the
      # 'before' arm for the experiment: one variable, same build.

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics,prometheus,chaosbeans,chaosseams
  metrics:
    tags:
      # Every series carries the service that emitted it, so one scrape file can
      # hold all of them without the names colliding.
      application: ${spring.application.name}
  distribution:
    percentiles-histogram:
      # Server-side latency distribution. Enabled for measurement, not for
      # resilience - phase 2 needs percentiles from inside the process, because
      # k6 only ever sees the edge and the interesting number is one hop in.
      http.server.requests: true
    percentiles:
      http.server.requests: 0.5,0.95,0.99
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
