spring:
  application:
    name: payments-edge
  threads:
    virtual:
      # Enabled from day one, deliberately. It changes how pool sizing behaves,
      # and phase 7 depends on having felt that from the start: virtual threads
      # do not fix a bounded resource, they move where the queue forms.
      enabled: true
  mvc:
    problemdetails:
      # Lets Spring render its own MVC exceptions as RFC-7807, alongside the
      # ProblemDetailHandler that web-starter contributes.
      enabled: true

  datasource:
    # The ordinary application database: merchant and idempotency_record. It has
    # no grant on the vault schema, which is a separate connection below.
    url: ${EDGE_DB_URL:jdbc:mysql://localhost:3306/payorch}
    username: ${EDGE_DB_USER:payorch}
    password: ${EDGE_DB_PASSWORD:payorch}
    hikari:
      pool-name: edge-pool
      maximum-pool-size: ${EDGE_DB_POOL_SIZE:20}

  jpa:
    # Off by default: it hides lazy-loading cost inside view rendering and makes
    # connection hold times impossible to reason about under load.
    open-in-view: false
    hibernate:
      # payment-orchestrator owns the migrations for this schema. This service
      # reads two of its tables and must fail loudly if its entities and those
      # migrations ever disagree.
      ddl-auto: validate

  flyway:
    # Deliberately off. One service owns the schema, and two Flyway instances
    # racing to apply the same migrations on startup is a genuinely unpleasant
    # failure. payment-orchestrator is the migration owner; compose starts this
    # service after it.
    enabled: false

payorch:
  # Phase 7a. The key behind the request fingerprint.
  #
  # NO DEFAULT IN THE STARTER, and RequestFingerprint throws on a blank one, so
  # a deployment that forgets this fails to start rather than quietly running
  # without the control.
  #
  # The reason it is keyed at all is worth reading in RequestFingerprint: the
  # material includes the card number, and this database stores the BIN and the
  # last four in plain text a few columns from where the fingerprint lands. An
  # unkeyed SHA-256 would therefore be about a million candidates to try, which
  # is under a second of laptop time, and the "hash" would hand back the PAN.
  #
  # A local development value like every other secret here. Phase 9c is where
  # secrets stop being literals; until then they are public by design and the
  # honesty is the point.
  idempotency:
    fingerprint-secret: ${IDEMPOTENCY_FINGERPRINT_SECRET:dev-local-fingerprint-key-not-a-real-secret}

    # Phase 7b. How long a duplicate may wait for the request that beat it.
    #
    # NEITHER OF THESE IS THE WAIT. The wait is whatever is left of the deadline
    # phase 3a stamped on the request - see EdgeConfiguration.idempotencyWaitBudget.
    # A fixed wait would be the one unbounded thing in a system built around not
    # having any: a duplicate holding on for 250ms while its caller had 40ms left
    # writes its reply to a connection nobody is reading.
    #
    # wait-reserve-ms is held back from that remaining budget so a waiter that
    # succeeds at the last possible moment still has time to serialize and write
    # the response. Without it, the slowest successful waits would time out
    # having done all of the work.
    wait-reserve-ms: ${IDEMPOTENCY_WAIT_RESERVE_MS:200}
    # Used only outside a request scope, where there is no deadline to consult.
    # Short on purpose: a fallback that waited as long as a real request would is
    # one that hides its own absence, and the symptom - a slow reply - gets
    # blamed on the network rather than on a missing bean.
    fallback-wait-ms: ${IDEMPOTENCY_FALLBACK_WAIT_MS:250}

  resilience:
    deadline:
      # The edge STAMPS the budget. It does not accept one.
      #
      # trust-inbound-header is false because this service's callers are
      # merchants: an X-Deadline-Ms of 600000 from an authenticated merchant
      # would hold a connection and its heap for ten minutes per request, which
      # is a denial of service that needs one header and no exploit.
      budget-ms: ${DEADLINE_BUDGET_MS:30000}
      # A hard ceiling on any budget, including a trusted inbound one. Also
      # overridable, because it clamps the internal hops and would otherwise
      # silently cap an experiment that only raised budget-ms.
      max-budget-ms: ${DEADLINE_MAX_BUDGET_MS:60000}
      # Below this, a hop declines rather than starting a call it cannot
      # finish. Overridable so the decline path can be demonstrated on a
      # live stack rather than only in a unit test.
      min-slice-ms: ${DEADLINE_MIN_SLICE_MS:50}
      trust-inbound-header: false

    rate-limit:
      # 3e. The layer 3d proved was missing: at 500 rps this service threw
      # OutOfMemoryError twice, and the connector's bulkhead - three services
      # downstream - reduced that to once. Nothing that refuses after the
      # request thread and the pooled connection are already spent can fix it.
      #
      # RATELIMIT_ENABLED=false is the control arm: the filter stays in the
      # chain, at the same position, doing everything except deciding.
      enabled: ${RATELIMIT_ENABLED:true}
      # read-modify-write is the deliberately non-atomic implementation, kept so
      # 3e can measure over-admission rather than assert it. Never a default.
      kind: ${RATELIMIT_KIND:atomic-lua}

      # Per merchant: fairness. Sized well above one merchant's honest traffic
      # and well below what one merchant could do to the others.
      merchant-burst: ${RATELIMIT_MERCHANT_BURST:100}
      merchant-per-sec: ${RATELIMIT_MERCHANT_RPS:50}

      # Per endpoint, service-wide: survival. This is the number that bounds the
      # process, and per-merchant limits cannot substitute for it - fifty
      # merchants each inside their own allowance still sum to an outage.
      #
      # 150/s against a measured death at 500/s, with a 300 burst so an honest
      # spike is absorbed rather than clipped.
      write-burst: ${RATELIMIT_WRITE_BURST:300}
      write-per-sec: ${RATELIMIT_WRITE_RPS:150}
      # Reads are one indexed lookup. Holding them to the write limit would
      # throttle merchants for polling payments we already accepted - which is
      # the behaviour we want instead of a retried write.
      read-per-sec: ${RATELIMIT_READ_RPS:500}

  orchestrator:
    # No timeout, on purpose. Phase 2 has to watch this call hang before phase 3
    # is allowed to put a deadline on it.
    base-url: ${ORCHESTRATOR_BASE_URL:http://localhost:8081}

  vault:
    # A SECOND connection, with its own credentials. vault_writer is granted
    # SELECT and INSERT on payorch_vault.token_vault and nothing else - see
    # docker/mysql/init/01-vault.sql. The application user above has no grant on
    # that schema at all.
    datasource:
      url: ${VAULT_DB_URL:jdbc:mysql://localhost:3306/payorch_vault}
      username: ${VAULT_DB_USER:vault_writer}
      password: ${VAULT_DB_PASSWORD:vault_writer_pw}
      pool-size: ${VAULT_DB_POOL_SIZE:5}
    # Local development key, and it must match psp-connector's or every
    # detokenization fails the GCM tag check. Phase 9c replaces the whole
    # static-key arrangement with envelope encryption.
    key: ${VAULT_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

server:
  port: 8080
  # The in-flight drain this enables is demonstrated and tested in phase 7.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics,prometheus,chaosbeans,chaosseams
  metrics:
    tags:
      # Every series carries the service that emitted it, so one scrape file can
      # hold all of them without the names colliding.
      application: ${spring.application.name}
  distribution:
    percentiles-histogram:
      # Server-side latency distribution. Enabled for measurement, not for
      # resilience - phase 2 needs percentiles from inside the process, because
      # k6 only ever sees the edge and the interesting number is one hop in.
      http.server.requests: true
    percentiles:
      http.server.requests: 0.5,0.95,0.99
  health:
    redis:
      # Deliberately off, and this is a correctness decision rather than test
      # convenience.
      #
      # 3e made the rate limiter fail OPEN when Redis is unreachable: a limiter
      # whose store is down admits everything rather than refusing everything,
      # because turning "the rate limiter's database is unavailable" into "the
      # payment API is down" trades a degradation for an outage. Leaving this
      # indicator on contradicts that decision - it marks the service DOWN, the
      # container healthcheck fails, and the orchestrator restarts a process
      # that was serving payments perfectly well.
      #
      # Redis trouble is not unmonitored. payorch.ratelimit.store.failures
      # counts every request admitted because Redis could not answer, which is
      # the signal that actually matters: the limiter has silently stopped
      # limiting. That series is the alert, not this indicator.
      enabled: false
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
