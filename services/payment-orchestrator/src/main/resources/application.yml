spring:
  # Phase 7i. The drain budget for `server.shutdown: graceful` below.
  #
  # Derived, not chosen: it has to exceed the longest a request may still be
  # running (the deadline budget), and docker-compose.yml's stop_grace_period
  # has to exceed IT, or Docker SIGKILLs a server that is draining correctly.
  # See payments-edge's application.yml for the chain and for what was broken
  # before this - Docker's default grace period is 10s, so the 30s drain was
  # being cut off two thirds of the way through.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_DRAIN:35s}
  application:
    name: payment-orchestrator
  threads:
    virtual:
      # Enabled from day one, deliberately. It changes how pool sizing behaves,
      # and phase 7 depends on having felt that from the start: virtual threads
      # do not fix a bounded resource, they move where the queue forms. The
      # Hikari pool below is exactly such a bounded resource.
      enabled: true
  mvc:
    problemdetails:
      enabled: true

  datasource:
    # Driven by environment so that phase 2 can point this at Toxiproxy's port
    # instead of MySQL's with a compose change and no code change.
    url: ${ORCHESTRATOR_DB_URL:jdbc:mysql://localhost:3306/payorch}
    username: ${ORCHESTRATOR_DB_USER:payorch}
    password: ${ORCHESTRATOR_DB_PASSWORD:payorch}
    hikari:
      pool-name: orchestrator-pool
      maximum-pool-size: ${ORCHESTRATOR_DB_POOL_SIZE:20}

  jpa:
    # Off by default: it hides lazy-loading cost inside view rendering and makes
    # connection hold times impossible to reason about under load.
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

payorch:
  # Phase 6. The async spine.
  events:
    # WHICH PUBLISHER, and the default is deliberate.
    #
    #   none    do nothing. Phases 1-5 run with no Kafka at all, and the async
    #           profile is optional - a service that refused to boot without a
    #           broker would make every earlier experiment depend on this one.
    #   direct  the naive dual-write. Kept selectable rather than deleted so the
    #           "before" arm of the outbox comparison can be RE-RUN rather than
    #           quoted from a writeup.
    #   outbox  a row in the same transaction as the payment. The point of the
    #           phase.
    publisher: ${EVENTS_PUBLISHER:none}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    topic: ${EVENTS_TOPIC:payment.events}

  # Phase 6k. The compensating half of the saga.
  #
  # OFF BY DEFAULT, like the publisher above and for the same reason: phases 1
  # to 6j run with no broker, and a service that refused to start without one
  # would make every earlier experiment depend on this one. Switched on in the
  # async compose profile.
  #
  # Note what this service becomes when it is on. Until now the orchestrator has
  # only ever published; this makes it a CONSUMER of a topic written by a
  # service downstream of it, which is what a choreographed saga looks like from
  # inside - the dependency graph stops being a line and becomes a cycle, on
  # purpose.
  saga:
    compensation:
      enabled: ${COMPENSATION_ENABLED:false}
      topic: ${COMPENSATION_TOPIC:payment.compensation}
      group: ${COMPENSATION_GROUP:orchestrator-compensation}
      dlq-topic: ${COMPENSATION_DLQ_TOPIC:payment.compensation.dlq}
      # Three tries, five seconds apart, then the DLQ. Short on purpose: a
      # provider refusing to reverse a capture is rarely transient, and the
      # useful outcome is a human seeing it quickly rather than a machine
      # trying for eleven minutes. Contrast the ledger's ladder, which is long
      # because most of what it retries IS transient.
      retry-attempts: ${COMPENSATION_RETRY_ATTEMPTS:3}
      retry-delay-ms: ${COMPENSATION_RETRY_DELAY_MS:5000}

  resilience:
    deadline:
      # Internal hop: it MUST trust the inbound header, because the remaining
      # budget arriving from upstream is the entire mechanism. A hop that
      # ignored it would restart the clock and the budget would never shrink.
      #
      # Still clamped to max-budget-ms. "Internal" describes today's network
      # topology, not a guarantee about who can reach this port.
      budget-ms: ${DEADLINE_BUDGET_MS:30000}
      # A hard ceiling on any budget, including a trusted inbound one. Also
      # overridable, because it clamps the internal hops and would otherwise
      # silently cap an experiment that only raised budget-ms.
      max-budget-ms: ${DEADLINE_MAX_BUDGET_MS:60000}
      # Below this, a hop declines rather than starting a call it cannot
      # finish. Overridable so the decline path can be demonstrated on a
      # live stack rather than only in a unit test.
      min-slice-ms: ${DEADLINE_MIN_SLICE_MS:50}
      trust-inbound-header: true

  # Phase 8a. The job that finally takes payments OUT of UNKNOWN.
  #
  # OFF BY DEFAULT, like the compensation consumer in 6k. It needs Redis and a
  # reachable connector, and a service that refused to start without them would
  # make every earlier experiment depend on this one.
  recon:
    unknown-poller:
      enabled: ${UNKNOWN_POLLER_ENABLED:false}
      interval-ms: ${UNKNOWN_POLLER_INTERVAL_MS:30000}
      # Startup is when the pool is coldest and nothing is warm. A payment that
      # has been UNKNOWN for an hour can wait another minute; the first real
      # requests cannot.
      initial-delay-ms: ${UNKNOWN_POLLER_INITIAL_DELAY_MS:60000}
      batch-size: ${UNKNOWN_POLLER_BATCH_SIZE:50}

      # THE GIVE-UP BOUND. Phase 8's trap: "a status poller without a give-up
      # state - payments stuck in UNKNOWN forever, polled forever - is a
      # slow-motion outage". A provider that has genuinely lost a payment will
      # never start answering, and an unbounded poller aimed at it is a
      # permanent load floor that grows with every incident this system has
      # ever had.
      max-attempts: ${UNKNOWN_POLLER_MAX_ATTEMPTS:8}

      # Exponential from a minute, CAPPED AT AN HOUR - and the cap is what makes
      # the attempt bound mean something in time rather than only in count.
      # Uncapped doubling reaches four days by the eighth attempt, so
      # "8 attempts" would mean "a week" and the payment would be functionally
      # abandoned long before it was formally given up on. Capped, eight
      # attempts is a few hours, which is roughly how long a provider incident
      # lasts and therefore roughly how long it is worth waiting before
      # admitting nobody is going to answer.
      base-backoff-ms: ${UNKNOWN_POLLER_BASE_BACKOFF_MS:60000}
      max-backoff-ms: ${UNKNOWN_POLLER_MAX_BACKOFF_MS:3600000}

      # Longer than a tick, so a slow batch does not have its lock taken out
      # from under it - see RedisLock.lostBeforeReleaseCount, which is the
      # number that says this is too short.
      lock-ttl-ms: ${UNKNOWN_POLLER_LOCK_TTL_MS:120000}

  connector:
    # No timeout setting here, and that is the phase-1 constraint rather than an
    # omission: phase 2 has to watch this call hang before phase 3 is allowed to
    # put a deadline on it.
    base-url: ${CONNECTOR_BASE_URL:http://localhost:8083}

server:
  port: 8081
  # The in-flight drain this enables is demonstrated and tested in phase 7.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics,prometheus,chaosbeans,chaosseams
  metrics:
    tags:
      # Every series carries the service that emitted it, so one scrape file can
      # hold all of them without the names colliding.
      application: ${spring.application.name}
  distribution:
    percentiles-histogram:
      # Server-side latency distribution. Enabled for measurement, not for
      # resilience - phase 2 needs percentiles from inside the process, because
      # k6 only ever sees the edge and the interesting number is one hop in.
      http.server.requests: true
    percentiles:
      http.server.requests: 0.5,0.95,0.99
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
