# Single source of truth for dependency versions across BOTH builds:
#   - the root build (services)
#   - the `infra-core` included build (starters)
#
# infra-core/settings.gradle.kts points at this exact file, so there is one
# catalog, not two that drift.
#
# Entries WITHOUT a version are resolved by the Spring Boot BOM
# (org.springframework.boot:spring-boot-dependencies), which every module
# applies as a platform in the root build.gradle.kts subprojects block.
# Verified against spring-boot-dependencies:4.1.0 before pinning.

[versions]
# Spring Boot 4.1.0 is the latest GA and targets Java 25.
# NOTE: Boot 4.x manages Jackson 3 (tools.jackson, 3.1.4) as the primary
# Jackson, with Jackson 2 (com.fasterxml.jackson, 2.21.4) available for
# compatibility. All our code targets Jackson 3.
springBoot = "4.1.0"
java = "25"

# Not managed by the Boot BOM - must be pinned here.
# 9.0 is the first release built against Jackson 3 (tools.jackson.core),
# which is why it lines up with Boot 4.x rather than fighting it.
logstashEncoder = "9.0"

uuidCreator = "6.1.1"        # UUIDv7 generation (phase 1)

# Phase 2+: declared now so the catalog is the place versions live,
# even before the first import.
resilience4j = "2.4.0"       # resilience4j-circuitbreaker (phase 3c)

[libraries]
# --- platform -------------------------------------------------------------
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- spring (versions from BOM) ------------------------------------------
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# The JDBC libraries WITHOUT spring-boot-starter-jdbc, and therefore without
# DataSourceAutoConfiguration. psp-connector has no application database - only
# a read-only token-vault connection - and the starter would fail its startup
# demanding a `spring.datasource.url` that has no business existing there.
spring-jdbc = { module = "org.springframework:spring-jdbc" }
hikaricp = { module = "com.zaxxer:HikariCP" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# The same Boot 4 module split that bit Flyway in phase 0, in the test
# dimension. `@AutoConfigureMockMvc` and the `@WebMvcTest` slice used to arrive
# with spring-boot-starter-test; in Boot 4 they live in a per-technology test
# module and the starter no longer carries them. The symptom is a compile error
# saying the package does not exist, which is at least louder than the runtime
# version of this trap.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
# Gradle 9 no longer puts the JUnit Platform launcher on the test runtime
# classpath implicitly; without it every test task fails to start.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }

# --- logging --------------------------------------------------------------
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }
logback-classic = { module = "ch.qos.logback:logback-classic" }
logback-core = { module = "ch.qos.logback:logback-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

# --- persistence ----------------------------------------------------------
mysql-connector = { module = "com.mysql:mysql-connector-j" }
# Boot 4 moved autoconfiguration into per-technology modules. Depending on
# org.flywaydb:flyway-core alone puts Flyway on the classpath but never
# triggers it - no error, no log line, and no migrations. The starter is what
# carries spring-boot-flyway (the autoconfiguration) with it.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Dialect support. Flyway refuses to run against MySQL 9 without it.
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }

# --- observability (phase 4, wired empty in phase 0) ----------------------
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-core = { module = "io.micrometer:micrometer-core" }

# Phase 4. The starter, not micrometer-tracing-bridge-otel on its own - the
# same Boot 4 module split that bit Flyway in phase 0 and Redis in 3e. The
# bridge puts the API on the classpath; the autoconfiguration that builds a
# Tracer, wires the OTLP exporter and installs the MDC correlation lives in
# spring-boot-micrometer-tracing-opentelemetry, which only the starter carries.
# Without it there is a Tracer nobody creates and traces nobody exports, and
# nothing says so.
#
# Versions come from the micrometer-tracing (1.7.0) and opentelemetry (1.62.0)
# BOMs, both imported by spring-boot-dependencies 4.1.0.
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
# The Tracer/Span API, for the manual spans on the seams. compileOnly in the
# starter: auto-instrumentation gives HTTP and JDBC, and it does not know what a
# payment is - a span per tokenization and per state transition is hand-written.
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
micrometer-observation = { module = "io.micrometer:micrometer-observation" }
# Thread-local context across a handoff. Not tracing-specific on purpose: it
# carries MDC through the same mechanism, so a trace-only implementation would
# have produced correlated traces attached to uncorrelated logs.
micrometer-context-propagation = { module = "io.micrometer:context-propagation" }

# --- identifiers ----------------------------------------------------------
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# --- phase 2+ (declared, not yet used) ------------------------------------
# The CORE circuit breaker, not resilience4j-spring-boot4.
#
# The Boot integration exists and does target Boot 4 (its 2.4.0 POM declares
# spring-boot-autoconfigure 4.0.0, checked before choosing). It is not used
# because its value is the @CircuitBreaker annotation, and this system needs
# breaker instances keyed dynamically by (provider, operation), configured from
# the psp_config table in 3f, with a custom predicate for what counts as a
# provider fault. None of that is expressible as an annotation on a method, and
# taking the starter would add a second Boot-version coupling for machinery that
# would then be bypassed.
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
# NOT chaos-monkey-spring-boot. Its latest release (4.0.0) declares Boot 4.0.2
# in its POM but is inert on Boot 4.1: no startup banner, and a latency assault
# configured at 2000ms produced a 76ms call. Its control endpoint is built on
# @RestControllerEndpoint, which Boot 4 no longer auto-configures a discoverer
# for, so it cannot be toggled at runtime either. infra-core/chaos-core
# implements the in-process layer instead - see the note in its build file.
# spring-aop + aspectjweaver, NOT spring-boot-starter-aop - that starter does
# not exist in Boot 4 (404 on Maven Central, absent from the BOM). Both of these
# are managed by the BOM, and Boot's AopAutoConfiguration switches on AspectJ
# auto-proxying as soon as aspectjweaver is present, so the starter's only real
# contribution is replaced.
spring-aop = { module = "org.springframework:spring-aop" }
aspectjweaver = { module = "org.aspectj:aspectjweaver" }

# Phase 3e. The rate limiters' shared store.
#
# The starter rather than lettuce-core alone, for the same Boot 4 reason Flyway
# taught in phase 0: the autoconfiguration that builds a connection factory and
# a RedisTemplate lives in spring-boot-data-redis, which the starter carries and
# the raw driver does not. Without it Redis is on the classpath and nothing is
# ever wired.
#
# Lettuce, not Jedis: it is the BOM default, it is non-blocking underneath, and
# a single shared connection is safe from many threads - which matters when the
# callers are virtual threads and there are thousands of them.
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# --- infra-core starters --------------------------------------------------
# Ordinary module coordinates. The root settings.gradle.kts substitutes each of
# these for the local project in the `infra-core` included build, so the version
# below is only consulted if that substitution is removed and a published
# snapshot is used instead.
payorch-logging-starter = { module = "com.payorch.infra:logging-starter", version = "0.1.0-SNAPSHOT" }
payorch-web-starter = { module = "com.payorch.infra:web-starter", version = "0.1.0-SNAPSHOT" }
payorch-resilience-starter = { module = "com.payorch.infra:resilience-starter", version = "0.1.0-SNAPSHOT" }
payorch-idempotency-starter = { module = "com.payorch.infra:idempotency-starter", version = "0.1.0-SNAPSHOT" }
payorch-observability-starter = { module = "com.payorch.infra:observability-starter", version = "0.1.0-SNAPSHOT" }
payorch-persistence-starter = { module = "com.payorch.infra:persistence-starter", version = "0.1.0-SNAPSHOT" }
payorch-tokenization-starter = { module = "com.payorch.infra:tokenization-starter", version = "0.1.0-SNAPSHOT" }
payorch-chaos-core = { module = "com.payorch.infra:chaos-core", version = "0.1.0-SNAPSHOT" }

# --- test -----------------------------------------------------------------
h2 = { module = "com.h2database:h2" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
