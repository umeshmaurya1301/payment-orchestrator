# Attaches the payment stack to SigNoz. Phase 4.
#
#     docker compose -f docker-compose.yml -f docker/signoz/payorch-obs.override.yml up -d
#
# Or, more simply, `tools/obs/signoz.sh attach`.
#
# WHY THIS IS AN OVERRIDE AND NOT PART OF docker-compose.yml
#
# `signoz-network` is external: it belongs to SigNoz's stack, and it does not
# exist unless SigNoz is running. Putting the network into the main compose file
# would make `docker compose up` fail outright on a machine that has never
# installed SigNoz - which is every machine reproducing experiments 00 through
# 06, and a 4 GB ClickHouse is not a prerequisite for running a payment.
#
# So the default stack is unchanged and unaware, exactly as it was for phases 1
# to 3, and observability is one extra `-f`. That is also what the phase-0 note
# in docker-compose.yml promised when it reserved the `obs` profile.
#
# The four services listed are the ones that carry a payment. The simulators are
# deliberately absent: they stand in for other people's systems, and a trace
# that showed our instrumentation inside a provider would be describing a
# topology we do not have.

networks:
  signoz-network:
    external: true

x-otlp: &otlp
  # The ingester's network alias, not localhost. Until now every service was
  # exporting to http://localhost:4318 - inside its own container, where nothing
  # listens - and the traces went nowhere at all. That is the default in
  # ObservabilityDefaults precisely so a developer without SigNoz sees no
  # errors; this is where it gets pointed at something real.
  # The base URL. ObservabilityDefaults appends /v1/traces, /v1/logs and
  # /v1/metrics, so one variable configures all three pipelines and they cannot
  # drift apart.
  OTLP_ENDPOINT: http://signoz-ingester:4318

  # Metrics, on. Off by default (see ObservabilityDefaults) because a service
  # with no collector logs a stack trace per export attempt; on here because
  # this file IS the statement that a collector exists.
  #
  # Without this the phase-4 dashboards cannot be built at all. Breaker state,
  # bulkhead saturation and the rolling P99 are gauges - there is no span that
  # says "the breaker is open", and a trace pipeline cannot answer a question
  # about something that did NOT happen because a breaker refused it.
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"

services:

  # Where alert notifications land. See docker/signoz/alert-sink/sink.py for
  # why a stack with no Slack workspace still needs a notification channel.
  #
  # On signoz-network only. It has no business on the payorch network: nothing
  # in the payment path calls it, and putting it there would let a bug in the
  # sink affect a payment.
  alert-sink:
    image: python:3.13-alpine
    container_name: payorch-alert-sink
    command: ["python", "-u", "/app/sink.py"]
    volumes:
      - ./docker/signoz/alert-sink:/app:ro
    networks: [signoz-network]
    healthcheck:
      # python, not curl or wget - the slim image has neither, and a
      # healthcheck that always fails would hold up `docker compose up -d`
      # with a timeout rather than an error.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:9095')"]
      interval: 10s
      timeout: 3s
      retries: 5

  payments-edge:
    environment:
      <<: *otlp
    networks: [payorch, signoz-network]

  payment-orchestrator:
    environment:
      <<: *otlp
    networks: [payorch, signoz-network]

  psp-connector:
    environment:
      <<: *otlp
    networks: [payorch, signoz-network]

  mock-psp-simulator:
    environment:
      <<: *otlp
    networks: [payorch, signoz-network]
